[package]
name = "polyvocoder"
version = "0.2.0"
edition = "2021"
description = "Polyvocoder Rust port — universal head for canon-aware multi-modal generation"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "canary"
path = "src/bin/canary.rs"

[[bin]]
name = "polyvocoder"
path = "src/bin/polyvocoder.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"


[dev-dependencies]
